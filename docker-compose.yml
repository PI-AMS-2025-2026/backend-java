services:

  postgres:
    image: postgres:17
    container_name: gini-postgres

    env_file:
      - .env
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .

    container_name: gini-api

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    env_file:
      - .env

volumes:
  postgres_data: