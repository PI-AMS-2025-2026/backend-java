spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: ''
  jpa:
    defer-datasource-initialization: true
  sql:
    init:
      encoding: UTF-8
      mode: always
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${SMTP_FROM:noreply@gini.local}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
  security:
    authorization:
      enabled: false
api:
  security:
    token:
      secret: ${JWT_SECRET:gini}
      expirationMs: ${TOKEN_EXPIRATION_MS:86400000}
      refreshExpirationMs: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}