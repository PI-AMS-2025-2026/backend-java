spring:
  datasource:
    # Nomes do contrato entre repositórios (SPRING_DATASOURCE_*), com fallback
    # para as variáveis DB_* usadas anteriormente, mantendo compatibilidade.
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
  jpa:
    hibernate:
      # O schema é propriedade do Flyway; o Hibernate apenas valida.
      ddl-auto: validate
  sql:
    init:
      encoding: UTF-8
      # data.sql NÃO deve rodar em produção: os dados iniciais vêm da
      # migration V1_0_1, e executar ambos causaria conflito de chaves.
      mode: never
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
api:
  security:
    token:
      secret: ${JWT_SECRET}
      expirationMs: ${TOKEN_EXPIRATION_MS:86400000}
      refreshExpirationMs: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
app:
  # Identifica o ambiente hospedado: dev, staging ou production.
  # Usado para (1) derivar o emissor dos tokens JWT, isolando os ambientes, e
  # (2) impedir que a documentação da API seja publicada em produção.
  #
  # Default "production" por ser o valor mais restritivo: se a variável não for
  # definida, a documentação não liga de forma alguma. O repositório de
  # infraestrutura deve definir APP_ENVIRONMENT em cada ambiente.
  environment: ${APP_ENVIRONMENT:production}
  swagger:
    # Interruptor único da documentação da API (Swagger UI + /v3/api-docs).
    # Default FECHADO: se a variável não for definida, a documentação não é
    # publicada. O repositório de infraestrutura deve definir
    # SWAGGER_ENABLED=true APENAS no ambiente de desenvolvimento.
    #
    # Quando habilitada, as rotas da documentação ficam SEM autenticação na
    # aplicação (ver ConfiguracaoSeguranca). A proteção é responsabilidade do
    # proxy reverso à frente do serviço (Basic Auth, allowlist de IP ou VPN),
    # portanto o contêiner não deve ser exposto diretamente à internet.
    enabled: ${SWAGGER_ENABLED:false}
springdoc:
  swagger-ui:
    enabled: ${app.swagger.enabled}
  api-docs:
    enabled: ${app.swagger.enabled}
server:
  # Atrás de proxy reverso, respeita os cabeçalhos X-Forwarded-* para que o
  # Swagger UI e os redirecionamentos montem URLs com o host/esquema externos
  # em vez do endereço interno do contêiner.
  # Pressupõe que o acesso ao serviço passa sempre pelo proxy da infraestrutura.
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        # Expõe somente o health; nenhum outro endpoint do Actuator.
        include: health
  endpoint:
    health:
      # Habilita /actuator/health/liveness e /actuator/health/readiness.
      probes:
        enabled: true
      # Não revela detalhes internos (banco, disco) a chamadores anônimos.
      show-details: never
