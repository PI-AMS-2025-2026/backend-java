spring.application.name=gini
spring.jpa.open-in-view=false
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# O contrato JSON da API e em snake_case (ver AlocacaoControllerTest e
# AutenticacaoControllerTest). Os DTOs usam camelCase em Java e esta
# estrategia faz a traducao nas duas direcoes.
spring.jackson.property-naming-strategy=SNAKE_CASE

# server.error.include-stacktrace=never - versão antiga
spring.web.error.include-stacktrace= never

# gera o create.sql automaticamente
# spring.jpa.properties.javax.persistence.schema-generation.create-source=metadata
# spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
# spring.jpa.properties.hibernate.hbm2ddl.delimiter=; 
# spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=create.sql


#spring.jpa.show-sql=true
#logging.level.org.hibernate.SQL=DEBUG

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Emissor dos tokens JWT, derivado do ambiente. O emissor e validado na
# verificacao, portanto um token emitido em um ambiente nao vale nos outros,
# mesmo que o JWT_SECRET seja o mesmo.
api.security.token.issuer=fatec-gini-${app.environment:local}
