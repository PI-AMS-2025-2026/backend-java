<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <style>
    @page { size: landscape; margin: 10mm; }
    body { font-family: Arial, sans-serif; font-size: 10px; color: #202124; }
    h1 { color: #1a365d; font-size: 20px; margin: 0 0 4px; }
    h2 { color: #fff; background: #1a365d; font-size: 14px; margin: 18px 0 6px; padding: 5px; page-break-after: avoid; }
    h3 { color: #1a365d; font-size: 12px; margin: 8px 0 5px; page-break-after: avoid; }
    .subtitle { color: #718096; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 14px; -fs-table-paginate: paginate; }
    tr { page-break-inside: avoid; }
    th, td { border: 1px solid #7b8794; padding: 5px; text-align: center; vertical-align: middle; }
    th { background: #d9e2ec; font-weight: bold; }
    .time { width: 90px; font-weight: bold; white-space: nowrap; }
    .subject { display: block; font-weight: bold; }
    .room { display: block; color: #52606d; margin-top: 3px; }
    .empty { color: #9aa5b1; }
  </style>
</head>
<body>
  <h1>Quadro horário</h1>
  <div class="subtitle" th:text="${modelo.subtitulo}">Curso</div>
  <p th:if="${modelo.turmas().isEmpty()}">Nenhuma turma ativa para o curso e ano selecionados.</p>
  <div th:each="turma : ${modelo.turmas}">
    <h2 th:text="${turma.titulo()}">Turma</h2>
    <p th:if="${turma.periodos().isEmpty()}">Nenhum quadro ativo para esta turma.</p>
    <div th:each="periodo : ${turma.periodos}">
    <h3 th:if="${periodo.titulo() != null}" th:text="${periodo.titulo()}">Período letivo</h3>
    <table>
      <thead>
        <tr>
          <th class="time">Horário</th>
          <th th:each="dia : ${modelo.dias}" th:text="${dia.nome}">Dia</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="linha : ${periodo.linhas}">
          <td class="time" th:text="${linha.bloco().rotulo()}">Horário</td>
          <td th:each="celula : ${linha.celulas}" th:classappend="${!celula.preenchida()} ? ' empty'">
            <span class="subject" th:if="${celula.preenchida()}" th:text="${celula.valor().disciplina().nome()}">Disciplina</span>
            <span class="room" th:if="${celula.preenchida() and celula.valor().professor() != null}" th:text="${celula.valor().professor()}">Professor</span>
            <span class="room" th:if="${celula.preenchida()}" th:text="${celula.valor().sala().codigo()}">Sala</span>
            <span th:unless="${celula.preenchida()}">-</span>
          </td>
        </tr>
      </tbody>
    </table>
    <p th:if="${periodo.linhas().isEmpty()}">Nenhuma alocação neste quadro.</p>
    </div>
  </div>
</body>
</html>
