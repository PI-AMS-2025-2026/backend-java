<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="pt-BR">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title th:text="'Tabela Horários ' + ${dataHorario.data}">Tabela Horários</title>
    <style type="text/css">
      * {
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      body {
        padding: 0;
      }

      .titulo {
        font-size: 28px;
        font-weight: bold;
        background: #1a1a1a;
        color: #fff;
        padding: 6px 12px;
        margin-bottom: 8px;
        text-align: left;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        table-layout: fixed;
      }

      th,
      td {
        border: 1.5px solid #333;
        text-align: center;
        vertical-align: middle;
      }

      th {
        background: #bfbfbf;
        color: #000000;
        font-size: 14px;
        font-weight: bold;
        padding: 6px 4px;
        height: 40px;
      }

      .hora {
        width: 15%;
        font-size: 13px;
        font-weight: bold;
        background: #f0f0f0;
        text-align: left;
        padding-left: 6px;
      }

      .materia {
        height: 85px;
        padding: 6px 4px;
        font-size: 14px;
        line-height: 1.3;
      }

      .lab {
        display: inline-block;
        margin-top: 8px;
        background: #1a1a1a;
        color: #fff;
        padding: 2px 4px;
        font-size: 11px;
        font-weight: bold;
      }

      .intervalo {
        border: 1.5px solid #333;
      }

      .intervalo td {
        height: 24px;
        background: #d8d8d8;
        border: none;
      }

      .vazio {
        background: #ffffff00;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="titulo">
      <span th:text="${dataHorario.turma}"></span>
      <span th:text="${dataHorario.data}"></span>
    </div>
    <table>
      <tr>
        <td class="vazio"></td>
        <th th:each="dia : ${dataHorario.diasSemana}" th:text="${dia}"></th>
      </tr>
      <tr
        th:each="linha : ${dataHorario.linhas}"
        th:classappend="${linha.intervalo} ? 'intervalo' : ''"
      >
        <td th:if="${!linha.intervalo}" class="hora" th:text="${linha.horario}"></td>
        <td th:if="${linha.intervalo}" th:colspan="${dataHorario.diasSemana.size() + 1}"></td>
        <td
          th:if="${!linha.intervalo}"
          th:each="celula : ${linha.celulas}"
          class="materia"
          th:rowspan="${celula.rowSpan}"
        >
          <span th:if="${!celula.vazia}" th:text="${celula.disciplina}"></span>
          <br th:if="${!celula.vazia}" />
          <span class="lab" th:if="${!celula.vazia}" th:text="${celula.sala}"></span>
        </td>
      </tr>
    </table>

    <script>
      window.onload = function () {
        window.print();
      };
    </script>
  </body>
</html>
